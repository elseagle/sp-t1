[tool.poetry]
name = "freight-rate-model"
version = "0.1.0"
description = "Freight load rate prediction: data cleaning, feature engineering, gradient-boosted models, and prediction pipeline"
authors = ["Sogo Ogundowole <dowolebolu@gmail.com>"]
readme = "README.md"
packages = [{ include = "freight_rate", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = ">=2.0,<3"
numpy = ">=1.26,<3"
matplotlib = ">=3.8,<4"
scikit-learn = "^1.5"
lightgbm = "^4.5"
joblib = "^1.4"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1"
ipykernel = "^6.29"
nbconvert = "^7.16"
seaborn = "^0.13"
pytest = "^8.3"

[tool.poetry.scripts]
freight-train = "freight_rate.train:main"
freight-predict = "freight_rate.predict:main"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
